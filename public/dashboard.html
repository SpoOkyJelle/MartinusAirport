<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bediening - Martinus Airport</title>
<style>
  :root { --yellow: #ffd23f; --red: #ff5a3c; --green: #5ee08a; --line: #232a36; --dim: #8693a6; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; background: #0a0d13; color: #e9edf3;
    font-family: Bahnschrift, 'Segoe UI', Arial, sans-serif;
    display: flex; justify-content: center; padding: 28px 16px 48px;
  }
  .wrap { width: 100%; max-width: 620px; display: grid; gap: 18px; align-content: start; }
  h1 { font-size: 15px; letter-spacing: .3em; color: var(--yellow); font-weight: 600; }
  h2 { font-size: 12px; letter-spacing: .22em; color: var(--dim); font-weight: 400; text-transform: uppercase; margin-bottom: 12px; }
  section { border: 1px solid var(--line); border-radius: 10px; padding: 20px; background: #0f131b; }

  .state { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  .lamp { width: 16px; height: 16px; border-radius: 50%; background: var(--sig, var(--green)); box-shadow: 0 0 14px var(--sig, var(--green)); flex: none; }
  .meter { height: 8px; border-radius: 4px; background: var(--line); margin-top: 16px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 100%; background: var(--sig, var(--green)); }
  .hint { margin-top: 10px; color: var(--dim); font-size: 14px; min-height: 1.3em; font-variant-numeric: tabular-nums; }

  button {
    width: 100%; padding: 26px 16px; border: 0; border-radius: 10px; cursor: pointer;
    font: inherit; font-size: 22px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #verbreek { background: var(--red); color: #1a0500; }
  #verbreek:hover { background: #ff7458; }
  #herstel { background: transparent; color: var(--green); border: 2px solid var(--green); padding: 16px; font-size: 16px; margin-top: 12px; }
  #herstel:hover { background: #5ee08a1c; }
  button:disabled { opacity: .3; cursor: default; pointer-events: none; }

  label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; font-size: 15px; }
  select { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 6px; background: #0a0d13; color: inherit; border: 1px solid var(--line); }

  .screens { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .screens a {
    display: block; padding: 14px; border: 1px solid var(--line); border-radius: 8px;
    color: inherit; text-decoration: none; font-weight: 600; letter-spacing: .04em;
  }
  .screens a:hover { border-color: var(--yellow); }
  .screens small { display: block; margin-top: 4px; color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .screens small.on { color: var(--green); }
  ul { list-style: none; padding: 0; margin-top: 14px; color: var(--dim); font-size: 14px; line-height: 1.7; }
  code { font-family: Consolas, monospace; color: #e9edf3; overflow-wrap: anywhere; }
  .offline .state::after { content: 'geen contact met server'; font-size: 13px; font-weight: 400; color: var(--red); letter-spacing: 0; }
  @media (max-width: 480px) { .screens { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>MARTINUS AIRPORT · BEDIENING</h1>

  <section>
    <h2>Verbinding met de toren</h2>
    <div class="state"><span class="lamp"></span><span id="state">Verbonden</span></div>
    <div class="meter"><i id="bar"></i></div>
    <div class="hint" id="hint"></div>
  </section>

  <section>
    <label>Hoe lang duurt het wegvallen?
      <select id="fade">
        <option value="5000">5 seconden</option>
        <option value="10000">10 seconden</option>
        <option value="20000" selected>20 seconden</option>
        <option value="30000">30 seconden</option>
        <option value="60000">1 minuut</option>
        <option value="120000">2 minuten</option>
      </select>
    </label>
    <button id="verbreek">Verbreek verbinding</button>
    <button id="herstel" disabled>Herstel verbinding</button>
    <p class="hint">De kinderen herstellen de verbinding door op de toren de noodfrequentie <b id="freq"></b> MHz in te vullen.</p>
  </section>

  <section>
    <h2>Schermen</h2>
    <div class="screens">
      <a href="/toren" target="_blank">Scherm 1 · Toren<small id="n-toren">niet geopend</small></a>
      <a href="/vluchten" target="_blank">Scherm 2 · Vluchten<small id="n-vluchten">niet geopend</small></a>
    </div>
    <ul id="urls"></ul>
  </section>
</div>

<script src="common.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });

  $('verbreek').onclick = () => post('/api/verbreek', { fadeMs: Number($('fade').value) });
  $('herstel').onclick = () => post('/api/herstel');

  function onState(st) {
    $('verbreek').disabled = !st.connected;
    $('herstel').disabled = st.connected;
    $('freq').textContent = st.frequentie;
    for (const role of ['toren', 'vluchten']) {
      const n = st.screens[role] || 0;
      const el = $('n-' + role);
      el.textContent = n ? n + (n === 1 ? ' scherm verbonden' : ' schermen verbonden') : 'niet geopend';
      el.className = n ? 'on' : '';
    }
    $('urls').innerHTML = st.urls.length
      ? '<li>Op een ander apparaat (zelfde wifi) open je:</li>' + st.urls.map((u) => `<li><code>${u}/toren</code> &nbsp;of&nbsp; <code>${u}/vluchten</code></li>`).join('')
      : '<li>Geen netwerk gevonden: de schermen werken alleen op deze computer.</li>';
  }

  function tick() {
    const st = Airport.state;
    const t = Airport.now();
    const s = Airport.strength(t);
    const hue = 150 * Math.pow(Math.max(0, (s - 0.15) / 0.85), 1.6);
    document.documentElement.style.setProperty('--sig', `hsl(${hue} 88% 55%)`);
    $('bar').style.width = s * 100 + '%';

    if (st.connected) {
      $('state').textContent = s < 1 ? 'Verbinding komt terug…' : 'Verbonden';
      $('hint').textContent = 'Alle vluchten op tijd.';
    } else if (s > 0) {
      $('state').textContent = 'Signaal valt weg… ' + Math.round(s * 100) + '%';
      $('hint').textContent = 'Nog ' + Math.ceil((st.lostAt + st.fadeMs - t) / 1000) + ' s tot de vluchten vertraagd raken.';
    } else {
      $('state').textContent = 'Verbroken';
      $('hint').textContent = 'Alle vluchten vertraagd. Op de toren kan nu de noodfrequentie ' + st.frequentie + ' worden ingevuld.';
    }
    requestAnimationFrame(tick);
  }

  Airport.connect('dashboard', onState);
  tick();
</script>
</body>
</html>
